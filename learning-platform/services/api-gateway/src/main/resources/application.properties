spring.cloud.gateway.server.webflux.routes[6].uri=http://enroll-service:8083
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/certificates/**


# =========================================================
# INTERNAL ENROLLMENT / PROGRESS
# =========================================================

spring.cloud.gateway.server.webflux.routes[7].id=internal-enrollment-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://enroll-service:8083
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/internal/**


