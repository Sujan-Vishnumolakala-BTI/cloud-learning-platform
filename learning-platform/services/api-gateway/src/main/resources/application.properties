spring.application.name=api-gateway

server.port=8080


# =========================================================
# USER SERVICE
# =========================================================

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://user-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**


# =========================================================
# AUTH SERVICE
# =========================================================

spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://user-service:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**


# =========================================================
# COURSE SERVICE
# =========================================================

spring.cloud.gateway.server.webflux.routes[2].id=course-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://course-service:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/courses/**

# =========================================================
# INSTRUCTOR COURSES
# =========================================================

