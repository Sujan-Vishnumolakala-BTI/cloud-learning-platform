spring.cloud.gateway.server.webflux.routes[10].uri=http://recommendation-service:8000
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/recommendations/**

# =========================================================
# QUESTION / OPTIONS SERVICE
# =========================================================

spring.cloud.gateway.server.webflux.routes[13].id=question-service
spring.cloud.gateway.server.webflux.routes[13].uri=http://course-service:8082
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/api/questions/**

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,gateway

management.endpoint.gateway.access=read-only

management.endpoint.health.show-details=always


# =========================================================
# CORS
# =========================================================

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true